name: android-web-shell

on:
  pull_request:
    paths:
      - "android-web-shell/**"
      - "pwa/**"
      - ".github/workflows/android-web-shell.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-web-shell-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('android-web-shell/app/src/main/assets/index.html').read_text()
          m=re.search(r'<script>(.*)</script>', html, re.S)
          assert m, 'script block missing'
          Path('/tmp/ekincep-base.js').write_text(m.group(1))
          PY
          node --check /tmp/ekincep-base.js
          node --check pwa/app-loader.js
          node --check pwa/sw.js
          for f in pwa/api/*.js android-web-shell/app/src/main/assets/phase*.js pwa/assets/phase*.js; do node --check "$f"; done
      - name: Run every phase test
        env:
          TZ: Europe/Istanbul
        run: |
          set -euo pipefail
          for f in android-web-shell/tests/phase*.test.cjs; do echo "==> $f"; node "$f"; done
      - name: Verify security and honest-data contracts
        run: |
          set -euo pipefail
          grep -q "PBKDF2" android-web-shell/app/src/main/assets/phase7-core.js
          grep -q "AES-GCM" android-web-shell/app/src/main/assets/phase7-core.js
          grep -q "activeTransactions" android-web-shell/app/src/main/assets/phase7-security.js
          grep -q "deletedAt" android-web-shell/app/src/main/assets/phase7-security.js
          grep -q "setAllowUniversalAccessFromFileURLs(false)" android-web-shell/app/src/main/java/app/ciftcidefteri/web/MainActivity.java
          grep -q "public void fetchMarket()" android-web-shell/app/src/main/java/app/ciftcidefteri/web/MainActivity.java
          grep -q "public void fetchFuel()" android-web-shell/app/src/main/java/app/ciftcidefteri/web/MainActivity.java
          grep -q "www.gtb.org.tr/salon-satis-fiyatlari" pwa/api/market.js
          grep -q "apigateway.epdk.gov.tr" pwa/api/fuel.js
          grep -q "Türkiye geneli resmî bülten" pwa/api/fuel.js
          grep -q "process.env.CDSE_CLIENT_ID" pwa/api/ndvi.js
          grep -q "process.env.CDSE_CLIENT_SECRET" pwa/api/ndvi.js
          grep -q "Canlı kamera değildir" android-web-shell/app/src/main/assets/phase11-satellite.js
          grep -q "ESKİ VERİ" android-web-shell/app/src/main/assets/phase11-home.js
          for label in "Bugün" "Bu sezon" "Tarlalar" "Canlı veriler" "Hızlı işler"; do grep -q "$label" android-web-shell/app/src/main/assets/phase11-home.js; done
          grep -q "commons.wikimedia.org" android-web-shell/app/src/main/assets/phase11-home-polish.js
          if grep -Eq 'raw\.githubusercontent\.com|cdn\.jsdelivr\.net|raw\.githack\.com' pwa/app-loader.js pwa/sw.js; then echo "Remote executable runtime source detected" >&2; exit 1; fi
          if grep -Eq '\beval\s*\(' pwa/app-loader.js; then echo "Production loader uses eval" >&2; exit 1; fi
          if grep -q "setAllowUniversalAccessFromFileURLs(true)" android-web-shell/app/src/main/java/app/ciftcidefteri/web/MainActivity.java; then echo "Unsafe WebView universal access" >&2; exit 1; fi
          if grep -q "borsa.tobb.org.tr" pwa/api/market.js; then echo "Broken TOBB TLS source returned to production adapter" >&2; exit 1; fi
      - name: Build standalone WebView APK
        working-directory: android-web-shell
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify isolated APK
        run: |
          set -euo pipefail
          APK="android-web-shell/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -q "assets/index.html"
          for f in phase10-core.js phase10-command.js phase11-premium-home.js phase11-home.js phase11-home-polish.js phase11-satellite.js; do unzip -l "$APK" | grep -q "assets/$f"; done
          unzip -l "$APK" | grep -q "classes.dex"
          PERMS=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK")
          echo "$PERMS" | grep -q "android.permission.INTERNET"
          if echo "$PERMS" | grep -Eq "android.permission.(ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION)"; then echo "Unexpected location permission" >&2; exit 1; fi
          sha256sum "$APK" > android-web-shell/app/build/outputs/apk/debug/SHA256SUMS.txt
      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ciftci-defteri-webview-apk
          path: |
            android-web-shell/app/build/outputs/apk/debug/app-debug.apk
            android-web-shell/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
