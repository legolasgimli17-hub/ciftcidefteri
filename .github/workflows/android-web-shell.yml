name: android-web-shell

on:
  pull_request:
    paths:
      - "android-web-shell/**"
      - ".github/workflows/android-web-shell.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-web-shell-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Check bundled JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('android-web-shell/app/src/main/assets/index.html').read_text()
          m=re.search(r'<script>(.*)</script>', html, re.S)
          assert m, 'script block missing'
          Path('/tmp/ciftci-app.js').write_text(m.group(1))
          PY
          node --check /tmp/ciftci-app.js
          node --check android-web-shell/app/src/main/assets/phase3-core.js
          node --check android-web-shell/app/src/main/assets/phase3.js
          node --check android-web-shell/app/src/main/assets/phase4-core.js
          node --check android-web-shell/app/src/main/assets/phase4.js
          node --check android-web-shell/app/src/main/assets/phase4-compat.js
          node --check android-web-shell/app/src/main/assets/phase5-core.js
          node --check android-web-shell/app/src/main/assets/phase5.js
          node --check android-web-shell/app/src/main/assets/phase6-polish.js
          node --check android-web-shell/app/src/main/assets/phase7-core.js
          node --check android-web-shell/app/src/main/assets/phase7-security.js
      - name: Run Phase 3 unit tests
        env:
          TZ: Europe/Istanbul
        run: node android-web-shell/tests/phase3.test.cjs
      - name: Run Phase 4 unit tests
        run: node android-web-shell/tests/phase4.test.cjs
      - name: Run Phase 5 unit tests
        run: node android-web-shell/tests/phase5.test.cjs
      - name: Run Phase 7 security tests
        run: node android-web-shell/tests/phase7.test.cjs
      - name: Verify product feature hooks
        run: |
          grep -q "fetchWeather" android-web-shell/app/src/main/java/app/ciftcidefteri/web/MainActivity.java
          grep -q "phase4-compat.js" android-web-shell/app/src/main/java/app/ciftcidefteri/web/MainActivity.java
          grep -q "phase5-core.js" android-web-shell/app/src/main/java/app/ciftcidefteri/web/MainActivity.java
          grep -q "phase5.js" android-web-shell/app/src/main/java/app/ciftcidefteri/web/MainActivity.java
          grep -q "phase6-polish.js" android-web-shell/app/src/main/java/app/ciftcidefteri/web/MainActivity.java
          grep -q "phase7-core.js" android-web-shell/app/src/main/java/app/ciftcidefteri/web/MainActivity.java
          grep -q "phase7-security.js" android-web-shell/app/src/main/java/app/ciftcidefteri/web/MainActivity.java
          grep -q "__TARLAPUSULA_SECURITY_READY__" android-web-shell/app/src/main/java/app/ciftcidefteri/web/MainActivity.java
          grep -q "phase5EditTx" android-web-shell/app/src/main/assets/phase5.js
          grep -q "Piyasa & Ürün Değeri" android-web-shell/app/src/main/assets/phase5.js
          grep -q "Hesap Makinesi" android-web-shell/app/src/main/assets/phase5.js
          grep -q "Türkiye referans fiyatları" android-web-shell/app/src/main/assets/phase5.js
          grep -q "TarlaPusula" android-web-shell/app/src/main/assets/phase6-polish.js
          grep -q "PBKDF2" android-web-shell/app/src/main/assets/phase7-core.js
          grep -q "AES-GCM" android-web-shell/app/src/main/assets/phase7-core.js
          grep -q "activeTransactions" android-web-shell/app/src/main/assets/phase7-security.js
          grep -q "deletedAt" android-web-shell/app/src/main/assets/phase7-security.js
          grep -q "Kayıt silindi" android-web-shell/app/src/main/assets/phase7-security.js
          grep -q "PIN’inle korunuyor" android-web-shell/app/src/main/assets/phase7-security.js
          grep -q 'android:label="TarlaPusula"' android-web-shell/app/src/main/AndroidManifest.xml
          if grep -q "delTx" android-web-shell/app/src/main/assets/phase5.js; then
            echo "Phase 5 ledger itself must stay edit-only; secure delete is injected by Phase 7" >&2
            exit 1
          fi
      - name: Build standalone WebView APK
        working-directory: android-web-shell
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify isolated APK
        run: |
          APK="android-web-shell/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -q "assets/index.html"
          unzip -l "$APK" | grep -q "assets/phase3-core.js"
          unzip -l "$APK" | grep -q "assets/phase3.js"
          unzip -l "$APK" | grep -q "assets/phase4-core.js"
          unzip -l "$APK" | grep -q "assets/phase4.js"
          unzip -l "$APK" | grep -q "assets/phase4-compat.js"
          unzip -l "$APK" | grep -q "assets/phase5-core.js"
          unzip -l "$APK" | grep -q "assets/phase5.js"
          unzip -l "$APK" | grep -q "assets/phase6-polish.js"
          unzip -l "$APK" | grep -q "assets/phase7-core.js"
          unzip -l "$APK" | grep -q "assets/phase7-security.js"
          unzip -l "$APK" | grep -q "classes.dex"
          PERMS=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK")
          echo "$PERMS" | grep -q "android.permission.INTERNET"
          if echo "$PERMS" | grep -Eq "android.permission.(ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION)"; then
            echo "Unexpected location permission" >&2
            exit 1
          fi
          sha256sum "$APK" > android-web-shell/app/build/outputs/apk/debug/SHA256SUMS.txt
      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ciftci-defteri-webview-apk
          path: |
            android-web-shell/app/build/outputs/apk/debug/app-debug.apk
            android-web-shell/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
