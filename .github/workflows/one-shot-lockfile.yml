name: one-shot-lockfile

on:
  push:
    branches:
      - hardening/android-native-build-v04
    paths:
      - ".github/workflows/one-shot-lockfile.yml"

permissions:
  contents: write

jobs:
  lockfile:
    if: github.repository == 'legolasgimli17-hub/ciftcidefteri'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
      - name: Refresh lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile to this branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "build: align lockfile with SDK 57 React"
          git push origin HEAD:hardening/android-native-build-v04
