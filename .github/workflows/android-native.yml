name: android-native

on:
  pull_request:
    paths:
      - "app/**"
      - "app.json"
      - "package.json"
      - "package-lock.json"
      - "src/application/**"
      - "src/domain/**"
      - "src/mobile/**"
      - "src/storage/**"
      - "scripts/android-emulator-phase1-smoke.mjs"
      - "scripts/verify-android-prebuild.mjs"
      - "scripts/verify-android-merged-manifest.mjs"
      - ".github/workflows/android-native.yml"
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "app.json"
      - "package.json"
      - "package-lock.json"
      - "src/application/**"
      - "src/domain/**"
      - "src/mobile/**"
      - "src/storage/**"
      - "scripts/android-emulator-phase1-smoke.mjs"
      - "scripts/verify-android-prebuild.mjs"
      - "scripts/verify-android-merged-manifest.mjs"
      - ".github/workflows/android-native.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: true
      NODE_ENV: development
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
          cache: npm
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify Expo dependency compatibility
        run: npx expo install --check
      - name: Generate Android native project
        run: npx expo prebuild --platform android --clean --no-install
      - name: Verify generated Android security policy
        run: node scripts/verify-android-prebuild.mjs
      - name: Build SQLCipher-enabled debug APK for physical ABIs
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace -PreactNativeArchitectures=armeabi-v7a,arm64-v8a
      - name: Verify merged Android permission policy
        run: node scripts/verify-android-merged-manifest.mjs
      - name: Verify APK output
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ciftci-defteri-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3

  phase1-emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CI: true
      NODE_ENV: production
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g
      PHASE1_APK_PATH: android/app/build/outputs/apk/release/app-release.apk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
          cache: npm
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify Expo dependency compatibility
        run: npx expo install --check
      - name: Generate Android native project
        run: npx expo prebuild --platform android --clean --no-install
      - name: Verify generated Android security policy
        run: node scripts/verify-android-prebuild.mjs
      - name: Make CI-only release build debuggable for sandbox inspection
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'android/app/build.gradle';
          let source = fs.readFileSync(file, 'utf8');
          const marker = 'release {';
          if (!source.includes(marker)) throw new Error('Gradle release buildType bulunamadı.');
          source = source.replace(marker, `${marker}\n            // CI smoke only: allows run-as to inspect the app sandbox.\n            debuggable true`);
          fs.writeFileSync(file, source);
          NODE
      - name: Build bundled SQLCipher release APK for emulator
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=x86_64
      - name: Verify emulator APK output
        run: test -s "$PHASE1_APK_PATH"
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Install Android emulator image
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -u+x | sort | tail -n 1)"
          AVDMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name avdmanager -perm -u+x | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          test -x "$AVDMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"
          echo "no" | "$AVDMANAGER" create avd --force --name phase1-smoke --package "system-images;android-35;google_apis;x86_64" --device "pixel_5"
          test -x "$SDK_ROOT/platform-tools/adb"
          test -x "$SDK_ROOT/emulator/emulator"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/emulator" >> "$GITHUB_PATH"
      - name: Start Android emulator
        run: |
          set -euo pipefail
          nohup emulator -avd phase1-smoke -no-window -noaudio -no-boot-anim -no-snapshot -wipe-data -gpu swiftshader_indirect -camera-back none -camera-front none > emulator.log 2>&1 &
          echo $! > emulator.pid
          adb wait-for-device
      - name: Run offline persistence and SQLCipher smoke
        run: node scripts/android-emulator-phase1-smoke.mjs
      - name: Upload Phase 1 emulator evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase1-android-emulator-evidence
          path: |
            dist-phase1-evidence
            emulator.log
          if-no-files-found: warn
          retention-days: 7
