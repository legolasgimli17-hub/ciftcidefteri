name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Expo dependency compatibility
        run: node scripts/verify-expo-compat.mjs
      - name: Core quality gates
        run: npm run check:core
      - name: Full app typecheck
        run: npx tsc -p tsconfig.json --noEmit
      - name: Android production bundle smoke
        env:
          NODE_ENV: production
        run: npx expo export --platform android --output-dir dist-smoke
      - name: Verify Android bundle output
        run: test -n "$(find dist-smoke -type f -print -quit)"
      - name: Expo project health
        run: npx expo-doctor@latest
      - name: Dependency audit
        run: npm audit --audit-level=high
