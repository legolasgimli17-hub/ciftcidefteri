name: expo-lock-refresh

on:
  pull_request:
    paths:
      - ".github/workflows/expo-lock-refresh.yml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
          cache: npm
      - name: Refresh Expo lock only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund "expo@~57.0.21" "expo-router@~57.0.20"
      - name: Verify refreshed lock installs
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify Expo compatibility after refresh
        run: node scripts/verify-expo-compat.mjs
      - name: Upload refreshed package files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: expo-lock-refresh
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 1
