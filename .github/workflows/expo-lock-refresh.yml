name: expo-lock-refresh

on:
  pull_request:
    paths:
      - ".github/workflows/expo-lock-refresh.yml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'release/device-acceptance-v04'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/device-acceptance-v04
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
          cache: npm
      - name: Refresh Expo lock only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund "expo@~57.0.21" "expo-router@~57.0.20"
      - name: Verify refreshed lock installs
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify Expo compatibility after refresh
        run: node scripts/verify-expo-compat.mjs
      - name: Commit verified package files
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Package files already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "build: refresh Expo compatible package lock"
          git push origin HEAD:release/device-acceptance-v04
