plugins {
    id 'com.android.application'
}

android {
    namespace 'app.ciftcidefteri.web'
    compileSdk 35

    defaultConfig {
        applicationId 'app.tarlapusula.final'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '1.3.1'
    }

    buildTypes {
        debug {
            debuggable false
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
