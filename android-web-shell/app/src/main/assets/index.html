<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1f6448">
<title>Çiftçi Defteri</title>
<style>
:root{--bg:#f3f5f1;--card:#fff;--ink:#17241c;--muted:#69736c;--green:#1f6448;--green2:#174d38;--red:#a63b3b;--line:#dce2dc;--soft:#eaf2ed;--shadow:0 8px 24px rgba(25,50,34,.07)}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}body{min-height:100vh;padding-bottom:88px}button,input,select,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:820px;margin:auto;padding:16px 14px 30px}.top{display:flex;justify-content:space-between;align-items:center;margin:6px 0 16px}.brand{font-size:27px;font-weight:950}.status{font-size:12px;font-weight:850;background:var(--soft);color:var(--green);padding:7px 10px;border-radius:999px}.hero{background:linear-gradient(145deg,var(--green),var(--green2));color:#fff;border-radius:24px;padding:22px;box-shadow:var(--shadow)}.hero small{opacity:.82;font-weight:800}.big{font-size:34px;font-weight:950;margin:4px 0 14px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{padding:11px;background:rgba(255,255,255,.12);border-radius:15px}.metric b{display:block;margin-top:3px;font-size:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:21px;padding:17px;margin-top:13px;box-shadow:var(--shadow)}.card h2{margin:0 0 13px;font-size:19px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:13px 0}.action{border:0;border-radius:17px;padding:16px 10px;font-size:17px;font-weight:900}.income{background:var(--green);color:#fff}.expense{background:#fff;color:var(--red);border:2px solid #ead4d4}label{display:block;margin:13px 0 6px;color:var(--muted);font-weight:850;font-size:13px}input,select,textarea{width:100%;min-height:50px;border:1.5px solid #cdd6cf;background:#fff;color:var(--ink);border-radius:13px;padding:11px 13px;outline:none}textarea{min-height:78px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.primary{width:100%;min-height:54px;border:0;border-radius:15px;background:var(--green);color:#fff;font-weight:900;font-size:16px;margin-top:15px}.segment{display:grid;grid-template-columns:1fr 1fr;background:#edf0ec;padding:5px;border-radius:14px;gap:5px}.segment button{border:0;background:transparent;padding:10px;border-radius:10px;font-weight:850;color:var(--muted)}.segment button.on{background:#fff;color:var(--ink)}.detail{background:#f8faf7;border:1px solid var(--line);border-radius:15px;padding:13px;margin-top:11px}.calc{background:var(--soft);color:var(--green);font-weight:850;padding:11px;border-radius:12px;margin-top:10px}.hint{font-size:13px;line-height:1.45;color:var(--muted)}.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.title{font-weight:850}.sub{font-size:12.5px;color:var(--muted);line-height:1.4;margin-top:3px}.amount{font-weight:900;white-space:nowrap}.in{color:var(--green)}.out{color:var(--red)}.small{border:1px solid var(--line);background:#fff;border-radius:11px;padding:8px 10px;font-weight:800}.danger{color:var(--red);background:#f8eeee}.pill{display:inline-block;padding:4px 7px;border-radius:999px;background:var(--soft);color:var(--green);font-size:11px;font-weight:850}.empty{text-align:center;color:var(--muted);padding:18px 5px}.page{display:none}.page.active{display:block}.hidden{display:none!important}.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:7px 5px 10px;z-index:20}.nav{max-width:820px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:3px}.nav button{border:0;background:transparent;color:var(--muted);border-radius:12px;padding:9px 2px;font-size:11px;font-weight:850}.nav button.active{background:var(--soft);color:var(--green)}.menuGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.menuBtn{border:1px solid var(--line);background:#fff;border-radius:15px;padding:15px;text-align:left;font-weight:850}.menuBtn span{display:block;color:var(--muted);font-size:12px;font-weight:650;margin-top:4px}.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(15px);opacity:0;background:#18251e;color:#fff;padding:11px 15px;border-radius:13px;font-weight:750;transition:.2s;z-index:50;max-width:92%;text-align:center}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.kpi{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.warn{background:#fff7e6;color:#76500e;border:1px solid #ecd8aa;border-radius:13px;padding:11px;font-size:13px;margin-top:10px}@media(min-width:640px){.nav button{font-size:13px}.menuGrid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="wrap"><div class="top"><div class="brand">Çiftçi Defteri</div><div id="storageStatus" class="status">Offline</div></div>
<section id="home" class="page active"><div class="hero"><small>KALAN</small><div id="balance" class="big">₺0,00</div><div class="metrics"><div class="metric"><small>GİREN</small><b id="sumIn">₺0,00</b></div><div class="metric"><small>ÇIKAN</small><b id="sumOut">₺0,00</b></div><div class="metric"><small>AÇIK BORÇ</small><b id="sumDebt">₺0,00</b></div></div></div><div class="actions"><button class="action income" onclick="openTx('income')">+ Gelir</button><button class="action expense" onclick="openTx('expense')">− Masraf</button></div><div class="card"><h2>Ürün bazında sonuç</h2><div id="cropProfit"></div></div><div class="card"><h2>Son kayıtlar</h2><div id="recent"></div></div></section>
<section id="tx" class="page"><div class="card"><h2 id="txTitle">Yeni kayıt</h2><div class="segment"><button id="segIn" onclick="setTxType('income')">Gelir</button><button id="segOut" onclick="setTxType('expense')">Masraf</button></div><label>Tarla / parsel</label><input id="parcel" placeholder="Örn. Köy altı 18 dönüm"><label>Ürün grubu</label><select id="cropGroup" onchange="fillCropItems()"></select><label>Ürün</label><select id="cropItem"></select><label>Hesap</label><select id="ownership" onchange="togglePartner()"><option value="self">Kendi hesabım</option><option value="partnership">Ortaklık</option></select><div id="partnerWrap" class="hidden"><label>Ortaklık</label><select id="partnerSelect"></select><div class="hint">Toplam işlem kaydedilir; özetlerde sana düşen pay kullanılır.</div></div><label>Ne için?</label><select id="txCategory" onchange="renderDetails()"></select><div id="txDetails"></div><label>Toplam tutar</label><input id="txAmount" inputmode="decimal" placeholder="Örn. 12.500,50"><label>Tarih</label><input id="txDate" type="date"><label>Durum</label><select id="txStatus"><option value="paid">Ödendi / alındı</option><option value="debt">Borç / veresiye</option><option value="receivable">Alacak</option></select><label>Not</label><textarea id="txNote" maxlength="160"></textarea><button class="primary" onclick="saveTx()">Kaydet</button></div></section>
<section id="ledger" class="page"><div class="card"><h2>Defter</h2><div id="ledgerRows"></div></div></section>
<section id="debts" class="page"><div class="card"><h2>Borç / Alacak ekle</h2><div class="grid2"><div><label>Tür</label><select id="debtType"><option value="owe">Ben borçluyum</option><option value="receive">Ben alacaklıyım</option></select></div><div><label>Tutar</label><input id="debtAmount" inputmode="decimal"></div></div><label>Kime / kimden?</label><input id="debtParty"><label>Tarih</label><input id="debtDate" type="date"><label>Not</label><input id="debtNote"><button class="primary" onclick="addDebt()">Ekle</button></div><div class="card"><h2>Açık borçlar ve alacaklar</h2><div id="debtRows"></div></div></section>
<section id="more" class="page"><div class="card"><h2>Diğer</h2><div class="menuGrid"><button class="menuBtn" onclick="showSub('inventory')">Elindekiler<span>Gübre, ilaç, mazot, ürün stoğu</span></button><button class="menuBtn" onclick="showSub('bank')">Banka<span>Kâr/zarardan ayrı</span></button><button class="menuBtn" onclick="showSub('partners')">Ortaklık<span>Pay oranları</span></button><button class="menuBtn" onclick="showSub('backup')">Yedek<span>İndir / geri yükle</span></button></div></div><div id="subContent"></div></section></div>
<div class="bottom"><div class="nav"><button id="nHome" class="active" onclick="showPage('home')">Ana sayfa</button><button id="nTx" onclick="openTx('expense')">Kayıt ekle</button><button id="nLedger" onclick="showPage('ledger')">Defter</button><button id="nDebts" onclick="showPage('debts')">Borçlar</button><button id="nMore" onclick="showPage('more')">Diğer</button></div></div><div id="toast" class="toast"></div>
<script>
const DB='ciftci-defteri-web-v1',STORE='kv',KEY='state',LS='ciftci_defteri_web_fallback_v1',MAX=9000000000000;let app={version:1,transactions:[],debts:[],inventory:[],bank:[],partnerships:[]},txType='expense',db=null;
const crops={'Genel':['Genel'],'Tarla bitkileri':['Pamuk','Buğday','Arpa','Mısır','Mercimek','Nohut','Ayçiçeği','Kanola','Çeltik','Şeker pancarı','Yonca','Fiğ','Soya'],'Tütün':['Tütün'],'Sebze':['Domates','Biber','Patlıcan','Salatalık','Kabak','Soğan','Sarımsak','Patates','Fasulye','Bezelye','Bamya','Lahana','Karnabahar','Brokoli','Marul','Ispanak','Havuç','Turp','Kavun','Karpuz'],'Meyve / bahçe':['Üzüm','Zeytin','Fındık','Antep fıstığı','Elma','Armut','Şeftali','Kayısı','Kiraz','Vişne','Nar','İncir','Badem','Ceviz','Portakal','Mandalina','Limon']};
const incCats=['Ürün satışı','Destek ödemesi','Kira geliri','Ortaklık tahsilatı','Diğer gelir'];const expCats=['İşçilik / amele','Mazot','Elektrik','Gübre','İlaç','Tohum / fide / fidan','Sulama','Traktör / makine','Hasat / biçerdöver','Nakliye / dolmuş','Kira','Bakım / tamir','Kasa / paketleme','Diğer masraf'];const fert=['Üre','DAP','20-20-0','15-15-15','Amonyum sülfat (şeker gübre)','CAN 26','Amonyum nitrat','Potasyum sülfat','Potasyum nitrat','Taban gübresi - diğer','Üst gübre - diğer','Organik / çiftlik gübresi','Yaprak gübresi','Diğer gübre'];const pest=['Yabancı ot ilacı','Böcek ilacı','Mantar ilacı','Akar ilacı','Tohum / fide koruma','Bitki gelişim ürünü','Diğer zirai ürün'];const jobs=['Çapa','Hasat / toplama','Dikim / ekim','Budama','Sulama işçiliği','Ayıklama','Yükleme / boşaltma','Paketleme','Diğer işçilik'];
function id(){return crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random()}function today(){return new Date().toISOString().slice(0,10)}function v(i){return document.getElementById(i)?.value||''}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function fmtDate(s){try{let[y,m,d]=s.split('-');return d+'.'+m+'.'+y}catch{return s}}function money(k){return new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',minimumFractionDigits:2}).format((Number(k)||0)/100)}function num(i){let s=v(i).trim().replace(/\./g,'').replace(',','.');let n=Number(s);return Number.isFinite(n)?n:0}function toast(m){let e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove('show'),2200)}
function parseMoney(raw){let x=String(raw||'').trim().replace(/₺/g,'').replace(/\bTL\b/gi,'').replace(/\s+/g,'');if(!x)throw Error('Tutar boş bırakılamaz');if(!/^[0-9.,]+$/.test(x))throw Error('Tutar biçimi anlaşılmadı');let whole='',frac='',cc=(x.match(/,/g)||[]).length,dc=(x.match(/\./g)||[]).length;if(cc===1){let[a,b]=x.split(',');if(!a||!b||b.length>2)throw Error('Tutar biçimi anlaşılmadı');whole=a.replace(/\./g,'');frac=b}else if(cc>1)throw Error('Tutar biçimi anlaşılmadı');else if(dc===0)whole=x;else if(dc===1){let[a,b]=x.split('.');if(b.length===3)whole=a+b;else if(b.length<=2){whole=a;frac=b}else throw Error('Tutar biçimi anlaşılmadı')}else{if(!/^\d{1,3}(\.\d{3})*$/.test(x))throw Error('Tutar biçimi anlaşılmadı');whole=x.replace(/\./g,'')}let k=BigInt(whole)*100n+BigInt((frac+'00').slice(0,2));if(k<=0n||k>BigInt(MAX))throw Error('Tutar sınır dışında');return Number(k)}
async function openDb(){return new Promise((res,rej)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE)};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}async function load(){try{db=await openDb();let s=await new Promise((res,rej)=>{let r=db.transaction(STORE,'readonly').objectStore(STORE).get(KEY);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});if(s)app=s;document.getElementById('storageStatus').textContent='Offline · IndexedDB'}catch{try{let s=localStorage.getItem(LS);if(s)app=JSON.parse(s);document.getElementById('storageStatus').textContent='Offline · yerel'}catch{}}norm();render()}function norm(){['transactions','debts','inventory','bank','partnerships'].forEach(k=>{if(!Array.isArray(app[k]))app[k]=[]})}async function save(){norm();try{if(db)await new Promise((res,rej)=>{let r=db.transaction(STORE,'readwrite').objectStore(STORE).put(app,KEY);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)});else localStorage.setItem(LS,JSON.stringify(app))}catch{try{localStorage.setItem(LS,JSON.stringify(app))}catch{toast('Kayıt alanına yazılamadı')}}}
function fillCrops(){cropGroup.innerHTML=Object.keys(crops).map(x=>`<option>${esc(x)}</option>`).join('');fillCropItems()}function fillCropItems(){cropItem.innerHTML=(crops[v('cropGroup')]||[]).map(x=>`<option>${esc(x)}</option>`).join('')}function fillPartners(){partnerSelect.innerHTML=app.partnerships.length?app.partnerships.map(p=>`<option value="${p.id}">${esc(p.name)} · benim payım %${p.share}</option>`).join(''):'<option value="">Önce ortaklık ekle</option>'}function togglePartner(){partnerWrap.classList.toggle('hidden',v('ownership')!=='partnership');fillPartners()}function openTx(t){showPage('tx');setTxType(t)}function setTxType(t){txType=t;segIn.classList.toggle('on',t==='income');segOut.classList.toggle('on',t==='expense');txTitle.textContent=t==='income'?'Gelir ekle':'Masraf ekle';txCategory.innerHTML=(t==='income'?incCats:expCats).map(x=>`<option>${esc(x)}</option>`).join('');renderDetails()}
function F(l,i,p,mode='decimal'){return `<label>${esc(l)}</label><input id="${i}" inputmode="${mode}" placeholder="${esc(p)}">`}function S(l,i,a){return `<label>${esc(l)}</label><select id="${i}">${a.map(x=>`<option>${esc(x)}</option>`).join('')}</select>`}function B(t,h){return `<div class="detail"><b>${esc(t)}</b>${h}</div>`}function bind(ids,fn){setTimeout(()=>ids.forEach(i=>document.getElementById(i)?.addEventListener('input',fn)),0)}function setTL(n){if(n>0)txAmount.value=n.toFixed(2).replace('.',',')}function calc(i,l,n){let e=document.getElementById(i);if(e)e.textContent=l+': '+money(Math.round(n*100))}
function renderDetails(){let c=v('txCategory');txDetails.innerHTML='';if(txType==='income'&&c==='Ürün satışı'){txDetails.innerHTML=B('Satış ayrıntısı',F('Miktar (kg)','saleKg','3500')+F('Birim fiyat (TL/kg)','salePrice','14,75')+'<div id="saleCalc" class="calc">Hesaplanan: ₺0,00</div>');bind(['saleKg','salePrice'],()=>{let t=num('saleKg')*num('salePrice');setTL(t);calc('saleCalc','Hesaplanan satış',t)});return}if(txType==='income')return;if(c==='İşçilik / amele'){txDetails.innerHTML=B('İşçilik',S('Yapılan iş','laborJob',jobs)+'<div class="grid2">'+F('Amele sayısı','workers','12','numeric')+F('Kaç gün','days','2')+'</div>'+F('Amele yevmiyesi (TL)','workerDaily','900')+'<div class="grid2">'+F('Çavuş sayısı','foremen','1','numeric')+F('Çavuş yevmiyesi (TL)','foremanDaily','1200')+'</div>'+F('Dolmuş / servis toplamı (TL)','transport','1500')+'<div id="laborCalc" class="calc">Hesaplanan: ₺0,00</div>');bind(['workers','days','workerDaily','foremen','foremanDaily','transport'],()=>{let d=num('days'),t=num('workers')*d*num('workerDaily')+num('foremen')*d*num('foremanDaily')+num('transport');setTL(t);calc('laborCalc','Hesaplanan işçilik',t)})}else if(c==='Mazot'){txDetails.innerHTML=B('Mazot',F('Kaç litre?','fuelLiters','180')+F('Litre fiyatı (TL)','fuelPrice','46,50')+'<div id="fuelCalc" class="calc">Hesaplanan: ₺0,00</div>');bind(['fuelLiters','fuelPrice'],()=>{let t=num('fuelLiters')*num('fuelPrice');setTL(t);calc('fuelCalc','Hesaplanan mazot',t)})}else if(c==='Elektrik'){txDetails.innerHTML=B('Elektrik faturası',F('Fatura dönemi','electricPeriod','Temmuz 2026','text')+F('Fatura tutarı (TL)','electricTotal','8750'));bind(['electricTotal'],()=>setTL(num('electricTotal')))}else if(c==='Gübre'){txDetails.innerHTML=B('Gübre',S('Gübre türü','fertType',fert)+F('Miktar (kg)','fertKg','1000')+F('Kg fiyatı (TL)','fertPrice','18,40')+'<div id="fertCalc" class="calc">Hesaplanan: ₺0,00</div>');bind(['fertKg','fertPrice'],()=>{let t=num('fertKg')*num('fertPrice');setTL(t);calc('fertCalc','Hesaplanan gübre',t)})}else if(c==='İlaç'){txDetails.innerHTML=B('İlaç / zirai ürün',S('Tür','pestType',pest)+F('Ürün / ticari ad','pestName','Ürün adı','text')+F('Miktar','pestQty','5')+S('Birim','pestUnit',['Litre','Kg','Paket / adet'])+F('Toplam alış (TL)','pestTotal','3250')+'<div class="hint">Sadece muhasebe kaydıdır; kullanım/doz bilgisi içermez.</div>');bind(['pestTotal'],()=>setTL(num('pestTotal')))}else if(c==='Tohum / fide / fidan'){txDetails.innerHTML=B('Tohum / fide',S('Tür','seedType',['Tohum','Fide','Fidan','Yumru / soğan','Diğer'])+F('Miktar','seedQty','25')+F('Toplam (TL)','seedTotal','4200'));bind(['seedTotal'],()=>setTL(num('seedTotal')))}else if(c==='Sulama'){txDetails.innerHTML=B('Sulama',S('Tür','waterType',['Elektrik pompası','Mazotlu pompa','Sulama birliği / su parası','Kanal / diğer'])+F('Kaç sulama?','waterCount','4','numeric')+F('Toplam (TL)','waterTotal','6500'));bind(['waterTotal'],()=>setTL(num('waterTotal')))}else if(c==='Traktör / makine'){txDetails.innerHTML=B('Makine işi',S('İş','machineJob',['Sürüm','Diskaro','Rotovatör','Ekim','İlaçlama','Gübreleme','Balya','Diğer'])+F('Saat / dönüm','machineQty','18')+F('Toplam (TL)','machineTotal','7200'));bind(['machineTotal'],()=>setTL(num('machineTotal')))}else if(c==='Hasat / biçerdöver'){txDetails.innerHTML=B('Hasat',S('Tür','harvestType',['Biçerdöver','Pamuk toplama makinesi','Elle hasat','Sebze / meyve toplama','Diğer'])+F('Dönüm / miktar','harvestQty','42')+F('Toplam (TL)','harvestTotal','16800'));bind(['harvestTotal'],()=>setTL(num('harvestTotal')))}else if(c==='Nakliye / dolmuş'){txDetails.innerHTML=B('Nakliye',S('Tür','transportType',['İşçi dolmuşu / servis','Ürün nakliyesi','Gübre / tohum nakliyesi','Makine taşıma','Diğer'])+F('Sefer sayısı','tripCount','3','numeric')+F('Sefer ücreti (TL)','tripPrice','1500')+'<div id="tripCalc" class="calc">Hesaplanan: ₺0,00</div>');bind(['tripCount','tripPrice'],()=>{let t=num('tripCount')*num('tripPrice');setTL(t);calc('tripCalc','Hesaplanan nakliye',t)})}else if(c==='Kasa / paketleme'){txDetails.innerHTML=B('Kasa / paketleme',F('Kasa / paket adedi','packCount','100','numeric')+F('Birim fiyat (TL)','packPrice','25')+'<div id="packCalc" class="calc">Hesaplanan: ₺0,00</div>');bind(['packCount','packPrice'],()=>{let t=num('packCount')*num('packPrice');setTL(t);calc('packCalc','Hesaplanan paketleme',t)})}}
function details(){let d={};document.querySelectorAll('#txDetails input,#txDetails select').forEach(e=>{if(e.value)d[e.id]=e.value});return d}async function saveTx(){let amount;try{amount=parseMoney(v('txAmount'))}catch(e){toast(e.message);return}let partnerId=null,share=100;if(v('ownership')==='partnership'){partnerId=v('partnerSelect');let p=app.partnerships.find(x=>x.id===partnerId);if(!p){toast('Önce ortaklık oluştur');return}share=p.share}app.transactions.unshift({id:id(),type:txType,amount,parcel:v('parcel').trim(),cropGroup:v('cropGroup'),crop:v('cropItem'),ownership:v('ownership'),partnerId,share,category:v('txCategory'),details:details(),status:v('txStatus'),date:v('txDate')||today(),note:v('txNote').trim(),createdAt:Date.now()});await save();txAmount.value='';txNote.value='';render();showPage('home');toast('Kayıt eklendi')}function eff(t){return t.ownership==='partnership'?Math.round(t.amount*(Number(t.share)||0)/100):t.amount}function sub(t){let d=t.details||{},a=[t.crop,t.parcel];if(d.laborJob)a.push(d.laborJob);if(d.workers)a.push(d.workers+' amele');if(d.foremen)a.push(d.foremen+' çavuş');if(d.fuelLiters)a.push(d.fuelLiters+' L mazot');if(d.fertType)a.push(d.fertType);if(d.fertKg)a.push(d.fertKg+' kg');if(d.pestType)a.push(d.pestType);if(d.pestName)a.push(d.pestName);let p=t.partnerId?app.partnerships.find(x=>x.id===t.partnerId):null;if(p)a.push(p.name+' · bana %'+t.share);a.push(fmtDate(t.date));return a.filter(Boolean).join(' · ')}function txRow(t,del=false){let e=eff(t),share=t.ownership==='partnership'?`<div class="sub">Toplam ${money(t.amount)} · Bana düşen ${money(e)}</div>`:'';return `<div class="row"><div><div class="title">${esc(t.category)}</div><div class="sub">${esc(sub(t))}</div>${share}</div><div><div class="amount ${t.type==='income'?'in':'out'}">${t.type==='income'?'+':'−'} ${money(e)}</div>${del?`<button class="small danger" onclick="delTx('${t.id}')">Sil</button>`:''}</div></div>`}async function delTx(i){if(confirm('Kayıt silinsin mi?')){app.transactions=app.transactions.filter(x=>x.id!==i);await save();render()}}
async function addDebt(){let amount;try{amount=parseMoney(v('debtAmount'))}catch(e){toast(e.message);return}if(!v('debtParty').trim()){toast('Kişi / işletme yaz');return}app.debts.unshift({id:id(),type:v('debtType'),party:v('debtParty').trim(),amount,paid:0,date:v('debtDate')||today(),note:v('debtNote').trim()});await save();debtAmount.value=debtParty.value=debtNote.value='';render()}async function payDebt(i){let d=app.debts.find(x=>x.id===i),raw=prompt('Kalan: '+money(d.amount-d.paid)+'\nÖdeme / tahsilat tutarı:');if(raw===null)return;let k;try{k=parseMoney(raw)}catch(e){toast(e.message);return}if(k>d.amount-d.paid){toast('Kalan tutardan fazla olamaz');return}d.paid+=k;await save();render()}async function delDebt(i){if(confirm('Borç/alacak silinsin mi?')){app.debts=app.debts.filter(x=>x.id!==i);await save();render()}}
function showSub(k){let c=subContent;if(k==='partners')c.innerHTML=`<div class="card"><h2>Ortaklıklar</h2><label>Ortaklık adı</label><input id="pName"><div class="grid2"><div><label>Benim payım (%)</label><input id="pShare" inputmode="decimal"></div><div><label>Açıklama</label><input id="pNote"></div></div><button class="primary" onclick="addPartner()">Ekle</button><div id="partnerRows"></div></div>`;if(k==='inventory')c.innerHTML=`<div class="card"><h2>Elindekiler</h2><div class="grid2"><div><label>Tür</label><select id="invType"><option>Gübre</option><option>İlaç</option><option>Tohum / fide</option><option>Mazot</option><option>Hasat edilmiş ürün</option><option>Diğer</option></select></div><div><label>Birim</label><select id="invUnit"><option>kg</option><option>litre</option><option>adet</option><option>paket</option><option>ton</option></select></div></div><label>Adı</label><input id="invName"><label>Başlangıç miktarı</label><input id="invQty" inputmode="decimal"><button class="primary" onclick="addInv()">Ekle</button><div id="inventoryRows"></div></div>`;if(k==='bank')c.innerHTML=`<div class="card"><h2>Banka hareketleri</h2><div class="warn">Banka hareketleri kâr/zarar hesabına eklenmez.</div><div class="grid2"><div><label>Tür</label><select id="bankType"><option value="in">Giriş</option><option value="out">Çıkış</option></select></div><div><label>Tutar</label><input id="bankAmount" inputmode="decimal"></div></div><label>Açıklama</label><input id="bankNote"><label>Tarih</label><input id="bankDate" type="date" value="${today()}"><button class="primary" onclick="addBank()">Ekle</button><div id="bankRows"></div></div>`;if(k==='backup')c.innerHTML=`<div class="card"><h2>Yedek</h2><div class="hint">Tüm defter, borç, stok, banka ve ortaklık tek JSON dosyasına çıkar.</div><button class="primary" onclick="exportBackup()">Yedeği indir</button><label class="primary" style="display:flex;align-items:center;justify-content:center">Yedek yükle<input id="backupFile" class="hidden" type="file" accept="application/json" onchange="importBackup(event)"></label></div>`;renderSub()}
async function addPartner(){let name=v('pName').trim(),share=Number(v('pShare').replace(',','.'));if(!name||!Number.isFinite(share)||share<=0||share>100){toast('Ad ve geçerli pay gir');return}app.partnerships.push({id:id(),name,share,note:v('pNote').trim()});await save();render();showSub('partners')}async function delPartner(i){if(app.transactions.some(t=>t.partnerId===i)){toast('Bu ortaklığa bağlı kayıt var');return}app.partnerships=app.partnerships.filter(x=>x.id!==i);await save();showSub('partners')}async function addInv(){let q=Number(v('invQty').replace(',','.'));if(!v('invName').trim()||!Number.isFinite(q)||q<0){toast('Ad ve geçerli miktar gir');return}app.inventory.push({id:id(),name:v('invName').trim(),type:v('invType'),unit:v('invUnit'),qty:q});await save();showSub('inventory')}async function moveInv(i,dir){let x=app.inventory.find(a=>a.id===i),raw=prompt((dir==='in'?'Eklenecek':'Kullanılacak')+' miktar ('+x.unit+'):');if(raw===null)return;let q=Number(raw.replace(',','.'));if(!Number.isFinite(q)||q<=0){toast('Geçerli miktar gir');return}if(dir==='out'&&q>x.qty){toast('Stok eksiye düşemez');return}x.qty+=dir==='in'?q:-q;await save();showSub('inventory')}async function addBank(){let amount;try{amount=parseMoney(v('bankAmount'))}catch(e){toast(e.message);return}app.bank.unshift({id:id(),type:v('bankType'),amount,note:v('bankNote').trim(),date:v('bankDate')||today()});await save();showSub('bank')}async function delBank(i){app.bank=app.bank.filter(x=>x.id!==i);await save();showSub('bank')}
function renderSub(){let p=document.getElementById('partnerRows');if(p)p.innerHTML=app.partnerships.length?app.partnerships.map(x=>`<div class="row"><div><div class="title">${esc(x.name)}</div><div class="sub">Benim payım %${x.share} · ${esc(x.note||'')}</div></div><button class="small danger" onclick="delPartner('${x.id}')">Kaldır</button></div>`).join(''):'<div class="empty">Ortaklık yok.</div>';let i=document.getElementById('inventoryRows');if(i)i.innerHTML=app.inventory.length?app.inventory.map(x=>`<div class="row"><div><div class="title">${esc(x.name)} <span class="pill">${esc(x.type)}</span></div><div class="sub">${x.qty.toLocaleString('tr-TR')} ${esc(x.unit)}</div></div><div><button class="small" onclick="moveInv('${x.id}','in')">+ Ekle</button> <button class="small" onclick="moveInv('${x.id}','out')">− Kullan</button></div></div>`).join(''):'<div class="empty">Stok yok.</div>';let b=document.getElementById('bankRows');if(b){let bal=app.bank.reduce((s,x)=>s+(x.type==='in'?x.amount:-x.amount),0);b.innerHTML=`<div class="kpi"><b>Banka takip bakiyesi</b><b>${money(bal)}</b></div>`+app.bank.map(x=>`<div class="row"><div><div class="title">${esc(x.note||'Banka hareketi')}</div><div class="sub">${fmtDate(x.date)}</div></div><div><div class="amount ${x.type==='in'?'in':'out'}">${x.type==='in'?'+':'−'} ${money(x.amount)}</div><button class="small danger" onclick="delBank('${x.id}')">Sil</button></div></div>`).join('')}}
function exportBackup(){let name='ciftci-defteri-yedek-'+today()+'.json',payload=JSON.stringify({format:'ciftci-defteri-web-v1',exportedAt:new Date().toISOString(),data:app},null,2);if(window.AndroidBridge){AndroidBridge.saveBackup(payload,name);return}let blob=new Blob([payload],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click()}window.onNativeBackupSaved=(ok,m)=>toast(ok?'Yedek kaydedildi: '+m:'Yedek kaydedilemedi: '+m);function importBackup(e){let f=e.target.files?.[0];if(!f)return;let r=new FileReader();r.onload=async()=>{try{let x=JSON.parse(r.result);if(x.format!=='ciftci-defteri-web-v1'||!x.data)throw 0;if(!confirm('Mevcut kayıtların yerine yedek yüklensin mi?'))return;app=x.data;norm();await save();render();toast('Yedek yüklendi')}catch{toast('Yedek dosyası geçersiz')}};r.readAsText(f);e.target.value=''}
function render(){let inc=app.transactions.filter(t=>t.type==='income').reduce((s,t)=>s+eff(t),0),out=app.transactions.filter(t=>t.type==='expense').reduce((s,t)=>s+eff(t),0),owe=app.debts.filter(d=>d.type==='owe').reduce((s,d)=>s+Math.max(0,d.amount-d.paid),0);balance.textContent=money(inc-out);sumIn.textContent=money(inc);sumOut.textContent=money(out);sumDebt.textContent=money(owe);recent.innerHTML=app.transactions.length?app.transactions.slice(0,6).map(t=>txRow(t)).join(''):'<div class="empty">Henüz kayıt yok.</div>';ledgerRows.innerHTML=app.transactions.length?app.transactions.map(t=>txRow(t,true)).join(''):'<div class="empty">Henüz kayıt yok.</div>';let by={};app.transactions.forEach(t=>{by[t.crop]??={i:0,o:0};by[t.crop][t.type==='income'?'i':'o']+=eff(t)});cropProfit.innerHTML=Object.keys(by).length?Object.entries(by).map(([c,x])=>`<div class="kpi"><span>${esc(c)}</span><b class="${x.i-x.o>=0?'in':'out'}">${money(x.i-x.o)}</b></div>`).join(''):'<div class="empty">Kayıt geldikçe ürün sonucu görünür.</div>';debtRows.innerHTML=app.debts.length?app.debts.map(d=>{let left=Math.max(0,d.amount-d.paid);return `<div class="row"><div><div class="title">${esc(d.party)} <span class="pill">${d.type==='owe'?'Borç':'Alacak'}</span></div><div class="sub">Toplam ${money(d.amount)} · Ödenen ${money(d.paid)} · ${fmtDate(d.date)}</div></div><div><div class="amount ${d.type==='owe'?'out':'in'}">${money(left)}</div>${left?`<button class="small" onclick="payDebt('${d.id}')">Ödeme</button>`:''} <button class="small danger" onclick="delDebt('${d.id}')">Sil</button></div></div>`}).join(''):'<div class="empty">Açık kayıt yok.</div>';fillPartners();renderSub()}
function showPage(x){document.querySelectorAll('.page').forEach(e=>e.classList.remove('active'));document.getElementById(x).classList.add('active');document.querySelectorAll('.nav button').forEach(e=>e.classList.remove('active'));let m={home:'nHome',tx:'nTx',ledger:'nLedger',debts:'nDebts',more:'nMore'};document.getElementById(m[x])?.classList.add('active');render();window.scrollTo(0,0)}
txDate.value=debtDate.value=today();fillCrops();setTxType('expense');load();
