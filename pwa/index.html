<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F5F7F2"><meta name="description" content="EkinCep; çiftçiler için tarla gideri, gelir, borç, stok, hava ve ürün değeri takibini tek yerde sunan güvenli ve çevrimdışı çalışabilen tarla defteridir."><meta name="application-name" content="EkinCep"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="EkinCep"><meta property="og:type" content="website"><meta property="og:title" content="EkinCep — Tarla defteri ve saha takibi"><meta property="og:description" content="Tarla gideri, gelir, borç, stok, hava ve ürün değeri takibi. Güvenli ve çevrimdışı çalışır."><meta property="og:image" content="https://ekincep.vercel.app/og.svg"><meta property="og:image:alt" content="EkinCep bazalt, pamuk ve tarla çizgilerinden oluşan uygulama kimliği"><meta name="twitter:card" content="summary_large_image"><title>EkinCep — Tarla defteri ve saha takibi</title><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg"><style>:root{color-scheme:light;--basalt:#202521;--cotton:#F5F7F2;--leaf:#376B43;--water:#24717A;--wheat:#C79B35;--dry:#A64538;--line:#CBD2CC;--muted:#56615A}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--cotton);font-family:"Segoe UI",Roboto,Arial,sans-serif;color:var(--basalt)}#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--cotton);visibility:hidden}#boot{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:22px;background:var(--cotton)}.shell{width:min(430px,100%);border:1px solid var(--line);border-left:6px solid var(--basalt);background:#fff;padding:22px 20px}.head{display:flex;gap:13px;align-items:center}.logo{width:56px;height:56px;flex:0 0 56px}.logo svg{width:100%;height:100%}.head h1{font-size:25px;letter-spacing:-.5px;margin:0;color:var(--basalt)}.head p{margin:4px 0 0;color:var(--muted);font-size:13px;line-height:1.45}.skeleton{display:grid;gap:11px;margin-top:24px;padding-top:18px;border-top:1px solid #E3E8E3}.sk{height:16px;background:#E3E8E3;animation:pulse 1.2s ease-in-out infinite alternate}.sk.big{height:76px;border-left:4px solid #BFD0C2}.sk.mid{width:74%}.sk.short{width:48%}@keyframes pulse{to{opacity:.42}}.error{display:none;margin-top:18px;padding:13px 14px;border:1px solid #D7B8B4;border-left:4px solid var(--dry);background:#fff;color:#70372F;font-size:13px;line-height:1.5}.retry{display:none;width:100%;min-height:52px;margin-top:12px;border:0;border-radius:7px;background:var(--basalt);color:#fff;font-weight:900;font-size:16px}@media(prefers-contrast:more){.shell{border-width:2px;border-left-width:7px}.head p{color:#36413A}.sk{background:#CBD2CC}.error{border-width:2px}}</style></head><body><div id="boot"><div class="shell"><div class="head"><div class="logo"><svg viewBox="0 0 48 48" aria-hidden="true"><rect x="2" y="2" width="44" height="44" rx="10" fill="#202521"/><path d="M8.5 31c7.8-6 16.8-8.7 30.5-8" stroke="#F5F7F2" stroke-width="2.5" stroke-linecap="round" fill="none"/><path d="M8.5 37c8.6-5.4 18.2-7 30.5-5.8" stroke="#376B43" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M12 25c4.4-4.4 9.5-7.1 15.6-8.6" stroke="#24717A" stroke-width="2.3" stroke-linecap="round" fill="none"/><circle cx="35" cy="13" r="3.7" fill="#C79B35"/></svg></div><div><h1>EkinCep</h1><p>Saha defteri hazırlanıyor…</p></div></div><div class="skeleton" id="skeleton"><div class="sk mid"></div><div class="sk big"></div><div class="sk"></div><div class="sk short"></div></div><div class="error" id="error">Uygulama dosyaları açılamadı. İnternet yoksa daha önce bir kez çevrimiçi açılmış olması gerekir. Kayıtların silinmedi.</div><button class="retry" id="retry" type="button">Tekrar dene</button></div></div><iframe id="app" title="EkinCep"></iframe><script>
const previewMatch=location.hostname==='raw.githack.com'&&location.pathname.match(/^\/legolasgimli17-hub\/ciftcidefteri\/([^/]+)\//);
const REF=previewMatch?previewMatch[1]:'main',ROOT='android-web-shell/app/src/main/assets/';
const BASES=[new URL('./assets/',location.href).href,'https://raw.githubusercontent.com/legolasgimli17-hub/ciftcidefteri/'+REF+'/'+ROOT,'https://cdn.jsdelivr.net/gh/legolasgimli17-hub/ciftcidefteri@'+REF+'/'+ROOT];
const FILES=['index.html','phase3-core.js','phase3.js','phase4-core.js','phase4.js','phase4-compat.js','phase5-core.js','phase5.js','phase6-polish.js','phase7-core.js','phase7-security.js','phase8-guard.js','phase8-redesign.js','phase9-field-ui.js','phase10-command-center.js'];
const DB='ekincep-pwa-cache-v1',STORE='assets';
function openCacheDb(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbGet(k){try{const d=await openCacheDb();return await new Promise((res,rej)=>{const r=d.transaction(STORE,'readonly').objectStore(STORE).get(k);r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error)})}catch{return null}}
async function idbPut(k,v){try{const d=await openCacheDb();await new Promise((res,rej)=>{const r=d.transaction(STORE,'readwrite').objectStore(STORE).put(v,k);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}catch{}}
async function getAsset(name){for(const base of BASES){try{const r=await fetch(base+name,{cache:'no-store'});if(r.ok){const t=await r.text();idbPut(name,t);return t}}catch{}}const cached=await idbGet(name);if(cached)return cached;throw new Error(name)}
function installBridge(w){const LAST='ekincep-last-weather-v1';w.AndroidBridge={saveBackup(content,requestedName){try{const name=String(requestedName||'ekincep-yedek.json').replace(/tarlapusula/gi,'ekincep').replace(/[^a-zA-Z0-9._-]/g,'-').slice(0,96);const b=new Blob([String(content||'')],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name.endsWith('.json')?name:name+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1400);w.onNativeBackupSaved&&w.onNativeBackupSaved(true,a.download)}catch{w.onNativeBackupSaved&&w.onNativeBackupSaved(false,'yedek oluşturulamadı')}},async fetchWeather(requestedLocation){const location=String(requestedLocation||'').trim();try{if(location.length<2||location.length>80)throw 0;const g=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(location)+'&count=1&language=tr&countryCode=TR&format=json').then(r=>{if(!r.ok)throw 0;return r.json()});const p=g.results&&g.results[0];if(!p)throw 0;const q=new URLSearchParams({latitude:String(p.latitude),longitude:String(p.longitude),current:'temperature_2m,weather_code',daily:'weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_gusts_10m_max',timezone:'auto',forecast_days:'3'});const forecast=await fetch('https://api.open-meteo.com/v1/forecast?'+q).then(r=>{if(!r.ok)throw 0;return r.json()});const payload=JSON.stringify({name:p.name||location,admin1:p.admin1||'',latitude:p.latitude,longitude:p.longitude,forecast});localStorage.setItem(LAST,payload);w.onNativeWeather&&w.onNativeWeather(true,payload)}catch{const cached=localStorage.getItem(LAST);w.onNativeWeather&&w.onNativeWeather(!!cached,cached||'weather_unavailable')}}};}
function injectScript(w,code){const s=w.document.createElement('script');s.textContent=code;(w.document.head||w.document.documentElement).appendChild(s);s.remove()}
async function boot(){const frame=document.getElementById('app'),error=document.getElementById('error'),retry=document.getElementById('retry');error.style.display='none';retry.style.display='none';try{const all=await Promise.all(FILES.map(getAsset)),base=all[0],scripts=all.slice(1);frame.onload=()=>{try{const w=frame.contentWindow;installBridge(w);let i=0;injectScript(w,scripts[i++]);w.effective=w.eff;w.renderAll=w.render;injectScript(w,scripts[i++]);if(w.renderAll)w.render=w.renderAll;while(i<scripts.length)injectScript(w,scripts[i++]);if(w.__TARLAPUSULA_SECURITY_READY__!==true)throw new Error('security');frame.style.visibility='visible';document.getElementById('boot').remove()}catch(e){console.error(e);error.style.display='block';retry.style.display='block'}};frame.srcdoc=base}catch(e){console.error(e);document.getElementById('skeleton').style.display='none';error.style.display='block';retry.style.display='block'}}
document.getElementById('retry').onclick=boot;boot();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
