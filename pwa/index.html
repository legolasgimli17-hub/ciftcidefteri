function openCacheDb(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE)};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}

async function idbPut(k,v){try{const d=await openCacheDb();await new Promise((res,rej)=>{const r=d.transaction(STORE,'readwrite').objectStore(STORE).put(v,k);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}catch{}}
function validAsset(name,text){if(!text)return false;if(name==='phase7-security.js')return text.includes('tp-pinInput')&&text.includes('bindPinInputs')&&text.includes('autocomplete="one-time-code"');if(name==='phase9-field-ui.js')return text.includes('phase11-app-shell.js')&&text.includes('__EKINCEP_INSTALL_UNIFIED_BACK__')&&text.includes('installBackSurfaceFix');if(name==='phase10-command-center.js')return text.includes('World_Imagery')&&text.includes('__EKINCEP_PHASE10_COMMAND_CENTER__');if(name==='phase11-app-shell.js')return text.includes('__EKINCEP_PHASE11_NATIVE_SHELL__')&&text.includes('e13-photoHero')&&text.includes('handleNativeBack');return true}

function installBridge(w){const LAST='ekincep-last-weather-v1';w.AndroidBridge={saveBackup(content,requestedName){try{const name=String(requestedName||'ekincep-yedek.json').replace(/[^a-zA-Z0-9._-]/g,'-').slice(0,96),b=new Blob([String(content||'')],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name.endsWith('.json')?name:name+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1200);w.onNativeBackupSaved&&w.onNativeBackupSaved(true,a.download)}catch{w.onNativeBackupSaved&&w.onNativeBackupSaved(false,'yedek oluşturulamadı')}},async fetchWeather(requestedLocation){const location=String(requestedLocation||'').trim();try{if(location.length<2||location.length>80)throw 0;const g=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(location)+'&count=1&language=tr&countryCode=TR&format=json').then(r=>{if(!r.ok)throw 0;return r.json()});const p=g.results&&g.results[0];if(!p)throw 0;const q=new URLSearchParams({latitude:String(p.latitude),longitude:String(p.longitude),current:'temperature_2m,weather_code',daily:'weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_gusts_10m_max',timezone:'auto',forecast_days:'3'});const forecast=await fetch('https://api.open-meteo.com/v1/forecast?'+q).then(r=>{if(!r.ok)throw 0;return r.json()});const payload=JSON.stringify({name:p.name||location,admin1:p.admin1||'',latitude:p.latitude,longitude:p.longitude,forecast});localStorage.setItem(LAST,payload);w.onNativeWeather&&w.onNativeWeather(true,payload)}catch{const cached=localStorage.getItem(LAST);w.onNativeWeather&&w.onNativeWeather(!!cached,cached||'weather_unavailable')}}};}
function injectScript(w,code){const s=w.document.createElement('script');s.textContent=code;(w.document.head||w.document.documentElement).appendChild(s);s.remove()}
async function boot(){const frame=document.getElementById('app'),error=document.getElementById('error'),retry=document.getElementById('retry'),progress=document.getElementById('progress');error.style.display='none';retry.style.display='none';progress.style.display='block';try{const all=await Promise.all(FILES.map(getAsset)),base=all[0],scripts=all.slice(1);if(!scripts.at(-1).includes('__EKINCEP_PHASE11_NATIVE_SHELL__')||!scripts[12].includes('__EKINCEP_INSTALL_UNIFIED_BACK__'))throw new Error('stale_bundle');frame.onload=()=>{try{const w=frame.contentWindow;installBridge(w);let i=0;injectScript(w,scripts[i++]);w.effective=w.eff;w.renderAll=w.render;injectScript(w,scripts[i++]);if(w.renderAll)w.render=w.renderAll;while(i<scripts.length)injectScript(w,scripts[i++]);if(typeof w.__EKINCEP_INSTALL_UNIFIED_BACK__==='function')w.__EKINCEP_INSTALL_UNIFIED_BACK__();if(w.__TARLAPUSULA_SECURITY_READY__!==true||w.__EKINCEP_PHASE11_NATIVE_SHELL__!==true||w.__EKINCEP_UNIFIED_BACK_PATCH__!==true)throw new Error('security_or_navigation');frame.style.visibility='visible';document.getElementById('boot').remove();try{indexedDB.deleteDatabase('ekincep-pwa-cache-v1');indexedDB.deleteDatabase('ekincep-pwa-assets-v12-1');indexedDB.deleteDatabase('ekincep-pwa-assets-v13');indexedDB.deleteDatabase('ekincep-pwa-assets-v13-1');indexedDB.deleteDatabase('ekincep-pwa-assets-v13-1-791adde')}catch{}}catch(e){console.error(e);progress.style.display='none';error.style.display='block';retry.style.display='block'}};frame.srcdoc=base}catch(e){console.error(e);progress.style.display='none';error.style.display='block';retry.style.display='block'}}
document.getElementById('retry').onclick=boot;boot();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?build='+BUILD,{updateViaCache:'none'}).catch(()=>{}));
