<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d131a"><meta name="description" content="EkinCep; çiftçiler için tarla gideri, gelir, borç, stok, hava ve ürün değeri takibini tek yerde sunan güvenli ve çevrimdışı çalışabilen tarla defteridir."><meta name="application-name" content="EkinCep"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="EkinCep"><meta property="og:type" content="website"><meta property="og:title" content="EkinCep — Tarla defteri ve saha takibi"><meta property="og:description" content="Tarla gideri, gelir, borç, stok, hava ve ürün değeri takibi. Güvenli ve çevrimdışı çalışır."><meta property="og:image" content="https://ekincep.vercel.app/og.svg"><meta property="og:image:alt" content="EkinCep uygulama logosu ve tarla çizgileri"><meta name="twitter:card" content="summary_large_image"><title>EkinCep — Tarla defteri ve saha takibi</title><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg"><style>:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0b1118;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f4f3ee;visibility:hidden}#boot{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 86% 0%,rgba(231,154,83,.15),transparent 30%),radial-gradient(circle at 10% 76%,rgba(121,199,255,.08),transparent 30%),linear-gradient(180deg,#111923,#080d13);color:#f7f1e8}.shell{width:min(430px,100%);border:1px solid rgba(255,255,255,.08);background:linear-gradient(180deg,#18212b,#111820);border-radius:22px;padding:22px;box-shadow:0 28px 80px rgba(0,0,0,.32)}.head{display:flex;gap:13px;align-items:center}.logo{width:56px;height:56px;flex:0 0 56px}.logo svg{width:100%;height:100%}.head h1{font-size:24px;margin:0}.head p{margin:4px 0 0;color:#b4bec7;font-size:13px;line-height:1.45}.skeleton{display:grid;gap:11px;margin-top:22px}.sk{height:18px;border-radius:8px;background:linear-gradient(90deg,#202a35 25%,#2a3642 40%,#202a35 60%);background-size:260% 100%;animation:shine 1.35s linear infinite}.sk.big{height:82px}.sk.mid{width:74%}.sk.short{width:48%}@keyframes shine{to{background-position:-160% 0}}.error{display:none;margin-top:18px;padding:14px;border-radius:12px;background:rgba(181,78,78,.09);border:1px solid rgba(255,151,151,.22);color:#ffd4d4;font-size:13px;line-height:1.5}.retry{display:none;width:100%;min-height:52px;margin-top:12px;border:0;border-radius:11px;background:linear-gradient(135deg,#efaa68,#d98742);color:#17120d;font-weight:900;font-size:16px}@media(prefers-contrast:more){.shell{border-width:2px;background:#0b1118}.head p{color:#d6dde3}.sk{background:#303d49}}</style></head><body><div id="boot"><div class="shell"><div class="head"><div class="logo"><svg viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="g" x1="7" y1="5" x2="41" y2="43"><stop stop-color="#17202a"/><stop offset="1" stop-color="#0b1118"/></linearGradient></defs><rect x="1.5" y="1.5" width="45" height="45" rx="13" fill="url(#g)"/><circle cx="34" cy="14" r="4.2" fill="#f0a158"/><path d="M9 31c8-7 17-10 30-9" stroke="#79c7ff" stroke-width="2.6" stroke-linecap="round" fill="none"/><path d="M9 37c9-6 18-8 30-7" stroke="#77c6a3" stroke-width="2.6" stroke-linecap="round" fill="none"/><path d="M11 25c5-5 10-8 17-10" stroke="#dce5ea" stroke-opacity=".9" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg></div><div><h1>EkinCep</h1><p>Güvenli saha defteri hazırlanıyor…</p></div></div><div class="skeleton" id="skeleton"><div class="sk mid"></div><div class="sk big"></div><div class="sk"></div><div class="sk short"></div></div><div class="error" id="error">Uygulama dosyaları açılamadı. İnternet yoksa daha önce bir kez çevrimiçi açılmış olması gerekir. Kayıtların silinmedi.</div><button class="retry" id="retry" type="button">Tekrar dene</button></div></div><iframe id="app" title="EkinCep"></iframe><script>
const previewMatch=location.hostname==='raw.githack.com'&&location.pathname.match(/^\/legolasgimli17-hub\/ciftcidefteri\/([^/]+)\//);
const REF=previewMatch?previewMatch[1]:'main',ROOT='android-web-shell/app/src/main/assets/';
const BASES=['https://raw.githubusercontent.com/legolasgimli17-hub/ciftcidefteri/'+REF+'/'+ROOT,'https://cdn.jsdelivr.net/gh/legolasgimli17-hub/ciftcidefteri@'+REF+'/'+ROOT];
const FILES=['index.html','phase3-core.js','phase3.js','phase4-core.js','phase4.js','phase4-compat.js','phase5-core.js','phase5.js','phase6-polish.js','phase7-core.js','phase7-security.js','phase8-guard.js','phase8-redesign.js','phase9-field-ui.js','phase10-command-center.js'];
const DB='ekincep-pwa-cache-v1',STORE='assets';
function openCacheDb(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbGet(k){try{const d=await openCacheDb();return await new Promise((res,rej)=>{const r=d.transaction(STORE,'readonly').objectStore(STORE).get(k);r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error)})}catch{return null}}
async function idbPut(k,v){try{const d=await openCacheDb();await new Promise((res,rej)=>{const r=d.transaction(STORE,'readwrite').objectStore(STORE).put(v,k);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}catch{}}
async function getAsset(name){for(const base of BASES){try{const r=await fetch(base+name,{cache:'no-store'});if(r.ok){const t=await r.text();idbPut(name,t);return t}}catch{}}const cached=await idbGet(name);if(cached)return cached;throw new Error(name)}
function installBridge(w){const LAST='ekincep-last-weather-v1';w.AndroidBridge={saveBackup(content,requestedName){try{const name=String(requestedName||'ekincep-yedek.json').replace(/tarlapusula/gi,'ekincep').replace(/[^a-zA-Z0-9._-]/g,'-').slice(0,96);const b=new Blob([String(content||'')],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name.endsWith('.json')?name:name+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1400);w.onNativeBackupSaved&&w.onNativeBackupSaved(true,a.download)}catch{w.onNativeBackupSaved&&w.onNativeBackupSaved(false,'yedek oluşturulamadı')}},async fetchWeather(requestedLocation){const location=String(requestedLocation||'').trim();try{if(location.length<2||location.length>80)throw 0;const g=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(location)+'&count=1&language=tr&countryCode=TR&format=json').then(r=>{if(!r.ok)throw 0;return r.json()});const p=g.results&&g.results[0];if(!p)throw 0;const q=new URLSearchParams({latitude:String(p.latitude),longitude:String(p.longitude),current:'temperature_2m,weather_code',daily:'weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_gusts_10m_max',timezone:'auto',forecast_days:'3'});const forecast=await fetch('https://api.open-meteo.com/v1/forecast?'+q).then(r=>{if(!r.ok)throw 0;return r.json()});const payload=JSON.stringify({name:p.name||location,admin1:p.admin1||'',latitude:p.latitude,longitude:p.longitude,forecast});localStorage.setItem(LAST,payload);w.onNativeWeather&&w.onNativeWeather(true,payload)}catch{const cached=localStorage.getItem(LAST);w.onNativeWeather&&w.onNativeWeather(!!cached,cached||'weather_unavailable')}}};}
async function boot(){const frame=document.getElementById('app'),error=document.getElementById('error'),retry=document.getElementById('retry');error.style.display='none';retry.style.display='none';try{const all=await Promise.all(FILES.map(getAsset)),base=all[0],scripts=all.slice(1);frame.onload=()=>{try{const w=frame.contentWindow;installBridge(w);let i=0;w.eval(scripts[i++]);w.eval('window.effective=window.eff;window.renderAll=window.render;');w.eval(scripts[i++]);w.eval('if(window.renderAll)window.render=window.renderAll;');while(i<scripts.length)w.eval(scripts[i++]);if(w.__TARLAPUSULA_SECURITY_READY__!==true)throw new Error('security');frame.style.visibility='visible';document.getElementById('boot').remove()}catch(e){console.error(e);error.style.display='block';retry.style.display='block'}};frame.srcdoc=base}catch(e){console.error(e);document.getElementById('skeleton').style.display='none';error.style.display='block';retry.style.display='block'}}
document.getElementById('retry').onclick=boot;boot();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
</script></body></html>
