<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d131a">
  <meta name="description" content="EkinCep; çiftçiler için tarla gideri, gelir, borç, stok, hava, ürün değeri, uydu görünümü ve saha takibini tek yerde sunan güvenli, çevrimdışı çalışabilen dijital tarla defteridir.">
  <meta name="application-name" content="EkinCep">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EkinCep">
  <meta property="og:type" content="website">
  <meta property="og:title" content="EkinCep — Tarla defteri ve saha takibi">
  <meta property="og:description" content="Tarla gideri, gelir, borç, stok, hava, ürün değeri ve uydu görünümü. Güvenli ve çevrimdışı çalışır.">
  <meta property="og:image" content="https://ekincep.vercel.app/og.svg">
  <meta property="og:image:alt" content="EkinCep uygulama logosu ve tarla çizgileri">
  <meta name="twitter:card" content="summary_large_image">
  <title>EkinCep — Tarla defteri ve saha takibi</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg">
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#0b1118;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    #app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f4f3ee;visibility:hidden}
    #boot{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 86% 0%,rgba(231,154,83,.15),transparent 30%),radial-gradient(circle at 10% 76%,rgba(121,199,255,.08),transparent 30%),linear-gradient(180deg,#111923,#080d13);color:#f7f1e8}
    .shell{width:min(430px,100%);border:1px solid rgba(255,255,255,.1);background:linear-gradient(180deg,#18212b,#111820);border-radius:22px;padding:22px;box-shadow:0 28px 80px rgba(0,0,0,.32)}
    .head{display:flex;gap:13px;align-items:center}.logo{width:56px;height:56px;flex:0 0 56px}.logo svg{width:100%;height:100%}.head h1{font-size:24px;margin:0}.head p{margin:4px 0 0;color:#c3ccd4;font-size:13px;line-height:1.45}
    .skeleton{display:grid;gap:11px;margin-top:22px}.sk{height:18px;border-radius:8px;background:linear-gradient(90deg,#202a35 25%,#2a3642 40%,#202a35 60%);background-size:260% 100%;animation:shine 1.35s linear infinite}.sk.big{height:82px}.sk.mid{width:74%}.sk.short{width:48%}@keyframes shine{to{background-position:-160% 0}}
    .error{display:none;margin-top:18px;padding:14px;border-radius:12px;background:rgba(181,78,78,.11);border:1px solid rgba(255,151,151,.28);color:#ffe0e0;font-size:13px;line-height:1.5}
    .retry{display:none;width:100%;min-height:54px;margin-top:12px;border:0;border-radius:11px;background:linear-gradient(135deg,#efaa68,#d98742);color:#17120d;font-weight:900;font-size:16px}
    @media(prefers-contrast:more){.shell{border:2px solid #fff;background:#080d13}.head p{color:#fff}.error{border-width:2px}.sk{background:#364552}}
  </style>
</head>
<body>
  <div id="boot" role="status" aria-live="polite">
    <div class="shell">
      <div class="head">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 48 48"><defs><linearGradient id="g" x1="7" y1="5" x2="41" y2="43"><stop stop-color="#17202a"/><stop offset="1" stop-color="#0b1118"/></linearGradient></defs><rect x="1.5" y="1.5" width="45" height="45" rx="13" fill="url(#g)"/><circle cx="34" cy="14" r="4.2" fill="#f0a158"/><path d="M9 31c8-7 17-10 30-9" stroke="#79c7ff" stroke-width="2.6" stroke-linecap="round" fill="none"/><path d="M9 37c9-6 18-8 30-7" stroke="#77c6a3" stroke-width="2.6" stroke-linecap="round" fill="none"/><path d="M11 25c5-5 10-8 17-10" stroke="#dce5ea" stroke-opacity=".9" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg>
        </div>
        <div><h1>EkinCep</h1><p>Güvenli saha defteri hazırlanıyor…</p></div>
      </div>
      <div class="skeleton" id="skeleton"><div class="sk mid"></div><div class="sk big"></div><div class="sk"></div><div class="sk short"></div></div>
      <div class="error" id="error">Uygulama açılamadı. Kayıtların silinmedi.</div>
      <button class="retry" id="retry" type="button">Tekrar dene</button>
    </div>
  </div>
  <iframe id="app" title="EkinCep"></iframe>
  <script src="/app-loader.js" defer></script>
</body>
</html>
